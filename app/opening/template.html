<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
body{background:radial-gradient(ellipse at 50% 38%,#74263F 0%,#4D192C 68%,#2F0F1A 100%)}
#root{position:fixed;inset:0;will-change:transform,opacity}
#stage{position:fixed;inset:0}#stage canvas{display:block}
#ui{position:fixed;left:0;right:0;top:61%;text-align:center;pointer-events:none}
#word{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:clamp(46px,15vw,76px);color:#F3E8D1;letter-spacing:.08em;line-height:1;white-space:nowrap}
#word span{display:inline-block;will-change:transform,opacity,filter}
#line{width:64px;height:2px;margin:18px auto 14px;background:#D9AE5B;transform-origin:50% 50%}
#tag{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:15px;color:#F4DDE5;letter-spacing:.02em}
</style></head><body><div id="root"><div id="stage"></div>
<div id="ui"><div id="word"><span>T</span><span>a</span><span>i</span><span>j</span><span>i</span></div><div id="line"></div><div id="tag">Shaadi planner</div></div></div>
